# Senders the company already deals with: addresses anyone here has written to, or keeps as a contact.
# Written by the Workspace app (/run/nw/rspamd/known_senders.map, one address per line) and re-read
# by Rspamd when it changes. On its own it scores nothing; see composites.conf.
KNOWN_SENDER {
  type = "header";
  header = "from";
  filter = "email:addr";
  map = "/run/nw/rspamd/known_senders.map";
  score = 0.0;
  description = "From someone the company writes to or keeps as a contact";
}

# Mail to a company that refuses email carrying programs (Admin → Company settings): its domains, written
# by Workspace (/run/nw/rspamd/block_programs.map). Scores nothing; force_actions.conf rejects such mail
# when it has a program attached.
BLOCK_PROGRAMS_RCPT {
  type = "rcpt";
  filter = "email:domain";
  map = "/run/nw/rspamd/block_programs.map";
  score = 0.0;
  description = "To a company that refuses programs by email";
}
