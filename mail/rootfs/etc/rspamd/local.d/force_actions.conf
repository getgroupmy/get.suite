# Email with a program or script attached (.exe, .js, .scr, .iso…, also inside an attached archive, or
# disguised as invoice.pdf.exe), to a company that refuses them (Admin → Company settings): refused while
# it's being delivered, so the sender gets it back with this message and nobody here receives it.
rules {
  BLOCK_PROGRAMS {
    action = "reject";
    expression = "BLOCK_PROGRAMS_RCPT & (MIME_BAD_EXTENSION | MIME_DOUBLE_BAD_EXTENSION)";
    message = "Programs and scripts aren't accepted by email here: send a link to the file instead";
    honor_action = ["reject"];
  }
}
