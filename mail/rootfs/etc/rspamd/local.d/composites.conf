# A known sender (multimap.conf) whose mail really comes from them (SPF or DKIM pass): less likely to be
# spam, so it isn't filed in Junk for a few borderline signs. A forged From from a known address gets
# nothing, as it doesn't pass either check.
KNOWN_SENDER_VERIFIED {
  expression = "~KNOWN_SENDER & (~R_DKIM_ALLOW | ~R_SPF_ALLOW)";
  score = -6.0;
  description = "A known sender, and the mail passes SPF or DKIM";
}
