# Keys are written by the Workspace app: /run/nw/dkim/<domain>.mail.key
enabled = true;
selector = "mail";
path = "/run/nw/dkim/$domain.$selector.key";
sign_authenticated = true;
sign_local = true;
use_domain = "header";
use_esld = false;
allow_username_mismatch = true;
allow_hdrfrom_mismatch = false;
try_fallback = true;   # use the path template above for every domain that has a key file
check_pubkey = false;
