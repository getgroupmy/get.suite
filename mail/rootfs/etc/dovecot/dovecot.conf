# NAS Workspace mail server — Dovecot (IMAP + LMTP delivery).
# Accounts live in /run/nw/dovecot and are generated by the Workspace app.
protocols = imap lmtp
listen = *
log_path = /dev/stderr
!include_try /etc/dovecot/hostname.conf
info_log_path = /dev/stdout

mail_location = maildir:/var/vmail/%d/%n/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota

# ---- TLS ----
ssl = required
ssl_cert = </run/nw-tls/fullchain.pem
ssl_key = </run/nw-tls/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# ---- authentication ----
auth_mechanisms = plain login
disable_plaintext_auth = yes
auth_master_user_separator = *
auth_cache_size = 0
# Sign-in protection settings written by the Workspace app (see server/src/security).
!include_try /run/nw/dovecot/policy.conf

# Webmail logs in as "user@domain*webmail" with a master secret held by the app.
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /run/nw/dovecot/masters
  master = yes
  result_success = continue
}
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /run/nw/dovecot/passwd
}
userdb {
  driver = passwd-file
  args = username_format=%u /run/nw/dovecot/passwd
  default_fields = uid=vmail gid=vmail home=/var/vmail/%d/%n
}

# ---- standard folders ----
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ---- services ----
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@localhost
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 30
}

# ---- quotas (per-mailbox limit comes from the passwd file) and spam filing ----
plugin {
  quota = count:Mailbox
  quota_vsizes = yes
  quota_rule = *:storage=0
  quota_rule2 = Trash:storage=+10%%
  quota_grace = 5%%
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
  sieve_before = /etc/dovecot/sieve/spam.sieve
  # Per-user script (vacation auto-reply) written by the Workspace app; compiled copy kept in the mailbox home.
  sieve = file:/run/nw/sieve/%u.sieve;bindir=~/.sieve-bin
  sieve_vacation_min_period = 1h
  sieve_vacation_default_period = 1d
  sieve_vacation_use_original_recipient = yes
}
